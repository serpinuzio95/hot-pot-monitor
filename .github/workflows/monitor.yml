name: Controllo HOT POT 逍遥烫

on:
  schedule:
    # 10:30 UTC = 12:30 Italia durante l'ora legale
    - cron: "30 10 * * *"

    # 11:30 UTC = 12:30 Italia durante l'ora solare
    - cron: "30 11 * * *"

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt

      - name: Controlla ristorante
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Salva stato precedente
        run: |
          git config user.name "HOT POT Monitor"
          git config user.email "hot-pot-monitor@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "Nessun cambiamento da salvare."
          else
            git commit -m "Aggiorna stato ristorante"
            git push
          fi
